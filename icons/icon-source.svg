<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Solid background fill per KaiOS guidance: icons should not be transparent -->
  <rect width="112" height="112" fill="#1b2733"/>

  <!-- Simple TV screen glyph: solid shapes, no gradients/textures (KaiOS guidance) -->
  <rect x="18" y="30" width="76" height="48" rx="6" fill="#4fc3f7"/>
  <rect x="26" y="38" width="60" height="32" rx="2" fill="#1b2733"/>

  <!-- TV stand -->
  <rect x="48" y="80" width="16" height="8" fill="#4fc3f7"/>
  <rect x="38" y="90" width="36" height="6" rx="3" fill="#4fc3f7"/>

  <!-- Antenna, suggesting live/broadcast -->
  <line x1="40" y1="30" x2="30" y2="16" stroke="#4fc3f7" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="30" x2="82" y2="16" stroke="#4fc3f7" stroke-width="4" stroke-linecap="round"/>

  <!-- Play triangle in screen, signaling a channel browser -->
  <path d="M50 48 L50 60 L62 54 Z" fill="#4fc3f7"/>
</svg>
